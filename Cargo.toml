[package]
name = "loop_edit"
version = "0.2.0"
edition = "2021"

[dependencies]
# GUI. Feature flags stay at what Debian 13 ships: GTK 4.18, libadwaita 1.7.
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }

# Audio I/O
pipewire = { version = "0.10", features = ["v0_3_44"] }
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"
hound = "3.5"

# Concurrency
crossbeam = "0.8"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Utilities
directories = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
